services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lvlup
      POSTGRES_PASSWORD: lvlup
      POSTGRES_DB: lvlup
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lvlup"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - postgres

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL_CHAT: ${ANTHROPIC_MODEL_CHAT:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL_EVAL: ${ANTHROPIC_MODEL_EVAL:-claude-haiku-4-5-20251001}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: lvlup
      POSTGRES_PASSWORD: lvlup
      POSTGRES_DB: lvlup
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: lvlup_papers
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  qdrant-data:
  postgres-data:
  grafana-data:
