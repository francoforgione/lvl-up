services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lvlup
      POSTGRES_PASSWORD: lvlup
      POSTGRES_DB: lvlup
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  qdrant-data:
  postgres-data:
